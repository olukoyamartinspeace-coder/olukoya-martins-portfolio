<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page Not Found | Olukoya Martins</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/asset/favicon-32.png">
<link rel="apple-touch-icon" href="/asset/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0a;
    --cream:#f0f0f0;
    --gray:#9a9aa2;
    --accent:#4f46e5;
    --r-pill:999px;
    --font-d:'League Spartan',sans-serif;
    --font-b:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--ink);color:var(--cream);
    font-family:var(--font-b);-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;overflow:hidden;
  }
  .grid-lines{
    position:fixed;inset:0;pointer-events:none;opacity:.25;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:80px 80px;
  }
  .glow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(79,70,229,.28),transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%);}
  .inner{position:relative;z-index:1;max-width:520px;}
  .code{
    font-family:var(--font-d);font-weight:900;font-size:160px;line-height:1;
    letter-spacing:-0.04em;margin:0;
    background:linear-gradient(120deg,#fff 30%,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1{font-family:var(--font-d);font-weight:700;font-size:32px;letter-spacing:-0.02em;margin:16px 0 12px;}
  p{color:var(--gray);font-size:17px;line-height:1.6;margin:0 0 36px;}
  .btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .pill{
    display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 32px;
    border:2px solid var(--cream);border-radius:var(--r-pill);
    font-family:var(--font-b);font-size:16px;font-weight:600;color:var(--cream);text-decoration:none;
    transition:background .25s,color .25s;
  }
  .pill:hover{background:var(--cream);color:var(--ink);}
  .pill--solid{background:var(--cream);color:var(--ink);border-color:var(--cream);}
  .pill--solid:hover{background:transparent;color:var(--cream);}
  @media (max-width:640px){ .code{font-size:110px;} h1{font-size:26px;} }
  #noise-canvas{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:80;
    image-rendering:pixelated;
    mix-blend-mode:screen;
    opacity:.06;
  }
</style>
</head>
<body>
  <canvas id="noise-canvas"></canvas>
  <div class="grid-lines"></div>
  <div class="glow"></div>
  <main class="inner">
    <div class="code">404</div>
    <h1>This page took a wrong turn.</h1>
    <p>The page you're looking for doesn't exist — but the work does. Head back to the main site.</p>
    <div class="btns">
      <a class="pill pill--solid" href="index.html">Back home</a>
      <a class="pill" href="index.html#work">See the work</a>
    </div>
  </main>
  <script>
    (function(){
      const canvas = document.getElementById('noise-canvas');
      const ctx = canvas.getContext('2d');
      const SCALE = 0.2;
      function resize(){
        canvas.width = Math.max(1, Math.floor(window.innerWidth * SCALE));
        canvas.height = Math.max(1, Math.floor(window.innerHeight * SCALE));
      }
      function draw(){
        const w = canvas.width, h = canvas.height;
        const imageData = ctx.createImageData(w, h);
        const buffer = imageData.data;
        for(let i = 0; i < buffer.length; i += 4){
          const shade = Math.floor(Math.random() * 255);
          buffer[i] = shade;
          buffer[i+1] = shade;
          buffer[i+2] = shade;
          buffer[i+3] = 255;
        }
        ctx.putImageData(imageData, 0, 0);
      }
      let frame = 0;
      function loop(){
        frame++;
        if(frame % 2 === 0) draw();
        requestAnimationFrame(loop);
      }
      resize();
      draw();
      if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
        requestAnimationFrame(loop);
      }
      window.addEventListener('resize', resize);
    })();
  </script>
</body>
</html>
